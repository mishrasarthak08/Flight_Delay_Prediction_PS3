name: Submission checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install project and checks
        run: python -m pip install -e '.[dev]'
      - name: Format and static checks
        run: |
          python -m black --check src scripts app tests
          python -m ruff check src scripts app tests
      - name: Tests and historical demo
        env:
          OMP_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: python -m pytest --cov=src --cov-report=term-missing
