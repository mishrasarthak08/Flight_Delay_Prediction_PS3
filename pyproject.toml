[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay-prediction"
version = "2.0.0"
description = "Availability-aware flight delay classification and offline schedule sensitivity"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "torch==2.14.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "scipy==1.18.1",
    "streamlit==1.66.1",
    "pyarrow==26.0.0",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "black==26.10.1", "ruff==0.17.2"]
notebooks = ["nbclient==0.11.0", "nbformat==5.11.1", "ipykernel==7.4.0"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F"]
